<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Familjens språkresa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: en kolumn, telefon först. En person i taget, ett kort i taget. Accentfärgen följer språket. */
:root{
  --bg:#EEF3FB; --surface:#FFFFFF; --ink:#1B2240; --muted:#5E6788; --line:#D5DDF0; --soft:#F5F8FE;
  --good:#1FA55B; --good-bg:#DDF6E7; --bad:#E0354A; --bad-bg:#FDE3E6;
  --fr:#2F5BFF; --fr2:#FF4D5A; --es:#E3313F; --es2:#F5B400;
  --accent:var(--fr); --accent2:var(--fr2);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11152A; --surface:#1C2242; --ink:#EEF1FF; --muted:#A3ABCC; --line:#2E3660; --soft:#232A50;
  --good:#3DDC84; --good-bg:#173A2A; --bad:#FF6B7D; --bad-bg:#43202A;
  --fr:#6F8CFF; --fr2:#FF6B76; --es:#FF5A66; --es2:#FFCB3D; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11152A; --surface:#1C2242; --ink:#EEF1FF; --muted:#A3ABCC; --line:#2E3660; --soft:#232A50;
  --good:#3DDC84; --good-bg:#173A2A; --bad:#FF6B7D; --bad-bg:#43202A;
  --fr:#6F8CFF; --fr2:#FF6B76; --es:#FF5A66; --es2:#FFCB3D; color-scheme:dark }
body[data-lang="es"]{--accent:var(--es); --accent2:var(--es2)}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:12px 40px;}
*{box-sizing:border-box}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
h1,h2,h3,.disp{font-family:var(--display); margin:0; line-height:1.05; text-wrap:balance}
h1{font-size:32px}
h1 span{color:var(--accent)}
h3.group{font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-top:4px}

/* topp */
.top{display:flex; align-items:center; gap:12px; min-height:64px}
.top .grow{flex:1; min-width:0}
.mascot{width:64px; height:64px; flex:none; animation:bob 2.6s ease-in-out infinite}
.mascot.cheer{animation:hop .6s ease}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
@keyframes hop{30%{transform:translateY(-14px) scale(1.08)}60%{transform:translateY(0) scale(.96)}}
.bubble{background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:8px 12px; font-weight:800; font-size:15px; display:inline-block; max-width:100%}
.adult{display:flex; align-items:center; gap:10px}
.adult .pi{font-size:38px}
.adult b{display:block; font-family:var(--display); font-size:22px; line-height:1}
.adult small{color:var(--accent); font-weight:800}
.switch{background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:6px 12px; font-weight:800; font-size:14px; flex:none}

/* vem övar */
.people{display:flex; flex-direction:column; gap:12px}
.person{background:var(--surface); border:3px solid var(--line); border-radius:var(--r); padding:16px; display:flex; align-items:center; gap:14px; text-align:left; transition:transform .15s}
.person:active{transform:scale(.98)}
.person .pi{font-size:52px; line-height:1}
.person b{font-family:var(--display); font-size:26px; display:block; line-height:1.1}
.person small{color:var(--muted); font-weight:700; font-size:15px}
.person[data-l="fr"]{box-shadow:0 5px 0 var(--fr)} .person[data-l="es"]{box-shadow:0 5px 0 var(--es)} .person[data-l="both"]{box-shadow:0 5px 0 var(--fr), 0 5px 0 var(--es)}

.langs{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.lang{border:3px solid var(--line); background:var(--surface); border-radius:var(--r); padding:12px; display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; transition:transform .15s}
.lang .flag{font-size:30px; line-height:1}
.lang[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 4px 0 var(--accent)}

.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.cat{background:var(--surface); border:2px solid var(--line); border-radius:var(--r); padding:14px 12px 12px; text-align:left; display:flex; flex-direction:column; gap:4px; min-height:146px; transition:transform .15s; min-width:0}
.cat:active{transform:scale(.97)}
.cat .pic{font-size:40px; line-height:1.1}
.cat .sv{font-family:var(--display); font-size:20px; font-weight:800; line-height:1.1}
.cat .fx{color:var(--accent); font-weight:800; font-size:14px}
.stars{margin-top:auto; font-size:16px; letter-spacing:2px; color:var(--line)}
.stars b{color:var(--es2); font-weight:400}

/* tema-sida */
.back{background:none; border:none; font-weight:800; color:var(--muted); padding:4px 0; align-self:flex-start; font-size:16px}
.hero{display:flex; align-items:center; gap:14px}
.hero .pic{font-size:52px}
.hero h2{font-size:30px}
.hero p{margin:2px 0 0; color:var(--accent); font-weight:800}
.big{border:none; border-radius:var(--r); padding:16px 20px; font-family:var(--display); font-size:23px; font-weight:800; display:flex; align-items:center; gap:14px; text-align:left; box-shadow:0 5px 0 rgba(0,0,0,.18); transition:transform .1s, box-shadow .1s}
.big:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.18)}
.big small{display:block; font-family:var(--body); font-size:15px; font-weight:700; opacity:.85}
.big .ic{font-size:34px}
.b1{background:var(--accent); color:#fff}
.b2{background:var(--accent2); color:#1B2240}
.preview{display:flex; flex-wrap:wrap; gap:8px}
.chip{background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:6px 12px; font-weight:700; font-size:15px}

/* grammatikregel */
.rule{background:var(--surface); border:2px solid var(--line); border-radius:var(--r); padding:16px 18px; line-height:1.55}
.rule p{margin:0}
.rule b{color:var(--accent)}
.conj{width:100%; border-collapse:collapse; margin-top:12px; font-size:17px}
.conj td{padding:9px 6px; border-top:1px solid var(--line); vertical-align:middle}
.conj td:first-child{font-weight:800; color:var(--accent)}
.conj td:last-child{color:var(--muted); text-align:right}
.conj tr{cursor:pointer}
.conj tr:active td{background:var(--soft)}
.hint{font-size:14px; color:var(--muted); margin-top:8px}

/* kort */
.dots{display:flex; gap:6px; justify-content:center; flex-wrap:wrap}
.dot{width:10px; height:10px; border-radius:50%; background:var(--line); transition:background .2s, transform .2s}
.dot.on{background:var(--accent); transform:scale(1.3)}
.dot.past{background:var(--accent); opacity:.4}
.card{background:var(--surface); border:3px solid var(--line); border-radius:28px; padding:28px 18px 22px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; width:100%; cursor:pointer}
.card.in{animation:slidein .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes slidein{from{transform:translateX(40px) rotate(3deg); opacity:.2}}
.card .pic{font-size:104px; line-height:1}
.wiggle{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-10deg) scale(1.08)}75%{transform:rotate(8deg) scale(1.04)}}
.word{font-family:var(--display); font-size:44px; font-weight:800; color:var(--accent); line-height:1.08; overflow-wrap:anywhere}
.word.long{font-size:30px}

.go{width:60px; height:10px; border-radius:99px; background:var(--line); overflow:hidden; flex:none}
.go i{display:block; height:100%; background:var(--good); animation:fill 1.6s linear forwards}

.yt{display:flex; align-items:center; gap:10px}
.jr{display:grid; grid-template-columns:1.4fr 1fr; gap:10px; width:100%}
.judge{border:2px solid var(--line); background:var(--surface); border-radius:18px; padding:14px 10px; font-family:var(--display); font-size:22px; font-weight:800; box-shadow:0 4px 0 var(--line)}
.judge.yes{background:var(--good); border-color:var(--good); color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.2)}
.mic{width:100%; border:none; border-radius:18px; padding:14px 10px; background:var(--accent); color:#fff; font-family:var(--display); font-size:22px; font-weight:800; box-shadow:0 4px 0 rgba(0,0,0,.2)}
.mic:active{transform:translateY(3px); box-shadow:none}
.mic.on{animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{50%{filter:brightness(1.15); box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 30%,transparent)}}
.mt{background:var(--surface); border:2px solid var(--line); border-radius:var(--r); padding:14px 16px; display:flex; flex-direction:column; gap:10px}

.mt .btns button[aria-pressed="true"]{border-color:var(--accent); color:var(--accent)}
.meter{height:16px; background:var(--line); border-radius:99px; overflow:hidden}

.sent .filled{color:var(--good); border-color:var(--good)}
.speaker{width:104px; height:104px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:50px; box-shadow:0 6px 0 rgba(0,0,0,.2)}
.speaker:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.2)}
.slowlink{background:none; border:none; color:var(--muted); font-weight:800; font-size:15px}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.opts.one{grid-template-columns:1fr}

.opts.one .opt.txt{font-size:20px; min-height:60px; justify-content:flex-start; text-align:left; padding:12px 16px}
.opt .swatch{width:62px; height:62px}
.opt .num{font-size:58px}
.opt:active{transform:scale(.96)}
.opt.ok{border-color:var(--good); background:var(--good-bg); animation:pop .4s}
.opt.no{border-color:var(--bad); background:var(--bad-bg); animation:shake .4s}
.opt.dim{opacity:.4}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.feedback{min-height:56px; display:flex; align-items:center; justify-content:space-between; gap:12px}
.feedback .msg{font-family:var(--display); font-size:22px; font-weight:800; min-width:0}
.msg.ok{color:var(--good)} .msg.no{color:var(--bad)}
.next{border:none; background:var(--accent); color:#fff; border-radius:16px; padding:12px 22px; font-weight:800; font-size:18px; box-shadow:0 4px 0 rgba(0,0,0,.2); flex:none}

/* klart */
.done{text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; padding-top:10px}
.bigstars{font-size:60px; letter-spacing:6px}
.bigstars span{display:inline-block; animation:starin .5s backwards}
.bigstars span:nth-child(2){animation-delay:.25s}
.bigstars span:nth-child(3){animation-delay:.5s}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.done h2{font-size:38px; color:var(--accent)}
.row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.note{font-size:14px; color:var(--muted); background:var(--surface); border:2px dashed var(--line); border-radius:14px; padding:10px 12px; margin:0}
#fx{position:fixed; inset:0; pointer-events:none; z-index:20}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}.go i{width:100%}}
@media (max-width:380px){.word{font-size:36px}.word.long{font-size:26px}h1{font-size:27px}.sent{font-size:25px}}

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){voices=[]}}
if("speechSynthesis" in window){loadVoices(); speechSynthesis.onvoiceschanged=loadVoices}
const FEMALE=/female|femme|mujer|amélie|amelie|audrey|aurélie|aurelie|marie|julie|denise|céline|celine|léa|virginie|monica|mónica|marisol|paulina|elvira|helena|laura|lucia|lucía|paloma|isabela|sabina|google fran|google espa/i;
const MALE=/\bmale\b|thomas|nicolas|henri|daniel|jorge|juan|diego|pablo|carlos|alvaro|álvaro|eddy|grandpa|reed|rocko/i;
function voiceFor(code){
  const pre=code.slice(0,2);
  const same=voices.filter(v=>v.lang && v.lang.replace('_','-')===code);
  const near=voices.filter(v=>v.lang && v.lang.slice(0,2)===pre);
  const pick=list=>list.find(v=>FEMALE.test(v.name)&&!MALE.test(v.name)&&/premium|enhanced|förbättrad|google/i.test(v.name))
    || list.find(v=>FEMALE.test(v.name)&&!MALE.test(v.name)) || list.find(v=>!MALE.test(v.name));
  return pick(same) || pick(near) || same[0] || near[0] || null;
}
function speak(text, slow, onend){
  let done=false; const fin=()=>{if(!done){done=true; onend&&onend()}};
  if(!("speechSynthesis" in window)){setTimeout(fin,600);return}
  try{
    speechSynthesis.cancel();
    const clean=text.replace(/\s*\([^)]*\)/g,"").replace(/\bLily\b/g, S.lang==="fr"?"Lili":"Lili").replace(/…/g,"");
    const u=new SpeechSynthesisUtterance(clean);
    const code=LANG[S.lang].tts; u.lang=code;
    const v=voiceFor(code); if(v) u.voice=v;
    u.rate=slow?0.55:0.85; u.pitch=PROFILES[S.p]?.kid?1.1:1;
    u.onend=fin; u.onerror=fin;
    setTimeout(fin, (slow?2400:1600)+clean.length*(slow?170:110)); // om enheten aldrig säger "klar"
    speechSynthesis.speak(u);
  }catch(e){fin()}
}

      return `<button class="opt ${side!=="pic"?"txt":""} ${st}" data-a="ans" data-v="${i}" ${done?"disabled":""}>${inner}</button>`}).join("");
  }
  const right = done && (q.type==="gap" ? q.opts[Q.answered]===q.a : q.opts[Q.answered]===q.it);
  const answerText = q.type==="gap" ? fullSentence(q) : q.it[S.lang];
  return `${header()}
  <div class="qhead"><button class="back" data-a="cat" data-v="${S.cat}" aria-label="Avsluta">✕</button>
    <div class="bar"><i style="width:${(Q.i+(done?1:0))/Q.qs.length*100}%"></i></div>
    <span class="score">⭐ ${Q.score}</span></div>
  <div class="prompt">${prompt}</div>
  <div class="opts ${one?"one":""}">${opts}</div>
  <div class="feedback">${!done?"":`<span class="msg ${right?"ok":"no"}">${right?"Rätt!":(q.type==="gap"?"Rätt svar: ":"Det var ")+esc(q.type==="gap"?q.a:answerText)}</span><button class="next" data-a="qnext">${Q.i<Q.qs.length-1?"Nästa →":"Klar!"}</button>`}</div>`;
}
function stars(score,total){const p=score/total;return p>=.85?3:p>=.6?2:p>=.35?1:0}
function doneView(){
  const Q=S.quiz, st=stars(Q.score,Q.qs.length), L=LANG[S.lang];
  const title = st===3?L.praise[3]:st===2?L.praise[0]:st===1?"Bra jobbat!":"Försök igen!";
  return `${header()}
  <div class="done">
    <div class="bigstars">${[0,1,2].map(i=>`<span style="color:${i<st?"var(--es2)":"var(--line)"}">★</span>`).join("")}</div>
    <h2>${esc(title)}</h2>
    <p style="margin:0;font-weight:800;font-size:20px">${Q.score} av ${Q.qs.length} rätt</p>
    <div class="row">
      <button class="big b1" data-a="quiz"><span class="ic">🔁</span><span>Spela igen</span></button>
      <button class="big b2" data-a="home"><span class="ic">🏠</span><span>Nytt tema</span></button>
    </div>
  </div>`;
}
const APP_VERSION="2026-10-25 10:58";
function resetAll(){
  if(!confirm("Börja om från början?\n\nAlla stjärnor, valt språk och vald person raderas för alla på den här enheten.")) return;
  try{Object.keys(localStorage).filter(k=>k.startsWith("sprakresa:")).forEach(k=>localStorage.removeItem(k))}catch(e){}
  location.reload();
}
/* Hämtar senaste sidan förbi alla cachar, lägger den i offlinecachen och laddar om.
   Utan nät laddas bara om, så att offlineversionen finns kvar. */
async function updateApp(btn){
  btn.textContent="🔄 Uppdaterar…";
  try{
    if(!navigator.onLine) throw 0;
    const res=await fetch("./index.html?u="+Date.now(),{cache:"reload"});
    if(!res.ok) throw 0;
    if(window.caches){const keys=await caches.keys(); for(const k of keys.filter(k=>k.startsWith("sprakresa-"))){const c=await caches.open(k); await c.put("./index.html",res.clone())}}
    const reg=await navigator.serviceWorker?.getRegistration(); await reg?.update().catch(()=>{});
  }catch(e){}
  location.reload();
}
function render(anim){
  document.body.dataset.lang=S.lang;
  if(!S.p && S.view!=="mictest") S.view="who";
  const v={mictest:mictestView,who:whoView,home,cat:catView,learn:()=>learn(anim),quiz:quizView,done:doneView}[S.view];
  $("#app").innerHTML=v()+`<div class="foot"><button class="linkbtn" data-a="reload">🔄 Uppdatera appen</button><button class="linkbtn" data-a="mictest">🎤 Mictest</button><button class="linkbtn" data-a="reset">🧹 Börja om från början</button><small>Version ${APP_VERSION}</small></div>`;
  scrollTo(0,0);
}

/* ---------- lyssna & säg efter ---------- */
let run=0, timers=[];
function stopAuto(){run++; timers.forEach(clearTimeout); timers=[]; try{speechSynthesis.cancel()}catch(e){} try{stopRec()}catch(e){}}
function setTurn(html,cls=""){const t=$("#turn"); if(t){t.className="turn "+cls; t.innerHTML=html}}
function wiggle(){const p=document.querySelector(".card .anim"); if(p){p.classList.remove("wiggle"); void p.offsetWidth; p.classList.add("wiggle")}}
function sayAfter(slow){
  stopAuto(); S.paused=false; const my=run, c=cat(); if(S.idx>=c.items.length) return;
  const w=c.items[S.idx][S.lang];
  wiggle(); setTurn("👂 Lyssna…");
  speak(w, slow, ()=>{
    if(my!==run) return;
    setTurn(`<div class="yt"><span class="ring"></span>Din tur! Säg det högt</div>
      ${REC?`<button class="mic" data-a="mic">🎤 Tryck och säg det</button><div class="heard" id="heard"></div>`:""}
      <div class="jr"><button class="judge yes" data-a="good">👍 Det satt</button><button class="judge" data-a="repeat">🔁 Igen</button></div>`,"col");
  });
}

/* ---------- mikrofon (Safari: Siri/diktering) ---------- */
const REC = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let rec=null;
function stopRec(){try{rec&&rec.abort()}catch(e){} rec=null}
const MIC_ART=/^(le|la|les|l|un|une|des|du|de|el|los|las|lo|unos|unas|al|del)$/;
function norm(t){return t.toLowerCase().replace(/\s*\([^)]*\)/g,"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9ñ ]+/g," ").split(/\s+/).filter(w=>w&&!MIC_ART.test(w)).join(" ")}
function lev(a,b){const m=a.length,n=b.length; if(!m||!n) return Math.max(m,n); let r=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){let prev=r[0]; r[0]=i; for(let j=1;j<=n;j++){const t=r[j]; r[j]=Math.min(r[j]+1,r[j-1]+1,prev+(a[i-1]===b[j-1]?0:1)); prev=t}} return r[n]}
function micMatch(heard,target){const h=norm(heard), t=norm(target); if(!t) return false;
  if(h===t||(" "+h+" ").includes(" "+t+" ")) return true;
  const tol=P()?.kid?0.4:0.3;
  if(lev(h,t)<=Math.max(1,Math.round(t.length*tol))) return true;
  // hela meningen inbäddad: titta på lika långa ordfönster
  const hw=h.split(" "), n=t.split(" ").length;
  for(let i=0;i+n<=hw.length;i++){const s=hw.slice(i,i+n).join(" "); if(lev(s,t)<=Math.max(1,Math.round(t.length*tol))) return true}
  return false}
function heard(html,cls){const h=$("#heard"); if(h){h.className="heard "+(cls||""); h.innerHTML=html}}
const MICLOG=[]; let micT0=0;
function mlog(m){const line=((performance.now()-micT0)/1000).toFixed(2)+"s  "+m; MICLOG.push(line); if(MICLOG.length>200) MICLOG.shift();
  const el=$("#mlog"); if(el){el.textContent=MICLOG.join("\n"); el.scrollTop=el.scrollHeight}}
/* Startar taligenkänning. Safari på iOS levererar ofta bara delresultat och avslutar inte alltid själv,
   därför: interimResults + continuous, egen tystnadstimer och en nödtimer som alltid återställer knappen. */
function startRec(lang, onText, onDone, cont){
  stopRec(); try{speechSynthesis.cancel()}catch(e){}
  micT0=performance.now(); MICLOG.length=0;
  const r=new REC(); rec=r;
  if(cont===undefined) cont=(store.get("micmode","single")==="cont");
  r.lang=lang; r.interimResults=true; r.continuous=!!cont; r.maxAlternatives=5;
  mlog("start lang="+lang+" continuous="+r.continuous+" hemskärm="+!!(navigator.standalone||matchMedia("(display-mode: standalone)").matches)+" nät="+navigator.onLine);
  let ended=false, quiet=null, stopped=false;
  const finish=(why)=>{if(ended) return; ended=true; clearTimeout(quiet); clearTimeout(hard); clearTimeout(soft); mlog("klar: "+why); if(rec===r) rec=null; onDone(why)};
  const stop=(why)=>{if(stopped) return; stopped=true; mlog("stop() – "+why); try{r.stop()}catch(e){} setTimeout(()=>finish(why),1500)};
  ["start","audiostart","soundstart","speechstart","speechend","soundend","audioend","nomatch"].forEach(ev=>r.addEventListener(ev,()=>mlog("event: "+ev)));
  r.onresult=e=>{
    const alts=[]; let fin=false;
    for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i]; fin=fin||res.isFinal; for(let j=0;j<res.length;j++) alts.push(res[j].transcript)}
    // hela texten hittills också, ifall ordet delats upp
    const all=[...e.results].map(x=>x[0].transcript).join(" ");
    mlog((fin?"FINAL":"delresultat")+": "+alts.map(a=>JSON.stringify(a)).join(" | "));
    clearTimeout(quiet); quiet=setTimeout(()=>stop("tyst 1,5 s efter tal"),1500);
    if(onText([...alts,all],fin)) stop("rätt svar");
  };
  r.onerror=e=>{mlog("error: "+e.error+(e.message?" – "+e.message:"")); finish("fel:"+e.error)};
  r.onend=()=>{mlog("event: end"); finish("end")};
  const soft=setTimeout(()=>stop("max 7 s"),7000);
  const hard=setTimeout(()=>finish("nödtimer 10 s (onend kom aldrig)"),10000);
  try{r.start()}catch(e){mlog("start() kastade: "+e.message); finish("fel:start")}
}
function listen(btn){
  const my=run, target=cat().items[S.idx][S.lang];
  let ok=false, last="", err="";
  btn.classList.add("on"); btn.textContent="🎤 Lyssnar… säg det nu"; heard("");
  startRec(LANG[S.lang].tts, (alts)=>{
    if(my!==run||ok) return true;
    last=alts[0]||last; heard("Jag hör: <b>"+esc(last)+"</b>");
    if(alts.some(a=>micMatch(a,target))){
      ok=true; heard("✅ "+(P().kid?LANG[S.lang].praise[Math.random()*5|0]:"Rätt!"),"ok");
      if(P().kid) S.bubble=LANG[S.lang].praise[Math.random()*5|0];
      cheer(); const t=setTimeout(()=>{if(my===run) advance()},1100); timers.push(t); return true}
    return false
  }, (why)=>{
    if(my!==run||ok) return;
    btn.classList.remove("on"); btn.textContent="🎤 Tryck och säg det igen";
    const e=why.startsWith("fel:")?why.slice(4):"";
    if(e) heard({"not-allowed":"Mikrofonen är inte tillåten. Tillåt mikrofon för Safari och slå på Siri och diktering.",
      "service-not-allowed":"Taligenkänning är avstängd. Slå på Siri och diktering i Inställningar.",
      "network":"Taligenkänningen behöver nät – använd knapparna nedanför.",
      "no-speech":"Jag hörde inget – tryck och säg det igen!",
      "audio-capture":"Hittar ingen mikrofon."}[e]||`Det gick inte att lyssna (${esc(e)}). Prova Mictest längst ner.`,"no");
    else if(last) heard("Jag hörde: <b>"+esc(last)+"</b> – försök igen!","no");
    else heard("Jag hörde inget – försök igen, eller öppna Mictest längst ner.","no");
  });
}

/* ---------- mictest ---------- */
let meterStop=null;
function mictestView(){
  const L=S.mtLang||LANG[S.lang]?.tts||"fr-FR";
  const info=[
    ["Taligenkänning",REC?(window.SpeechRecognition?"SpeechRecognition":"webkitSpeechRecognition"):"<b>saknas</b>"],
    ["Uppläsning",("speechSynthesis" in window)?voices.length+" röster":"saknas"],
    ["Säker anslutning (https)",String(window.isSecureContext)],
    ["Startad från hemskärmen",String(!!(navigator.standalone||matchMedia("(display-mode: standalone)").matches))],
    ["Nät",navigator.onLine?"online":"<b>offline</b>"],
    ["getUserMedia",String(!!navigator.mediaDevices?.getUserMedia)],
    ["Webbläsare",esc(navigator.userAgent)]];
  return `<button class="back" data-a="${S.p?"home":"who"}">← Tillbaka</button>
  <h1>🎤 Mictest</h1>
  <div class="mt"><h3>1. Hörs mikrofonen?</h3>
    <p class="kv">Testar mikrofonen direkt, utan Siri. Stapeln ska röra sig när du pratar.</p>
    <div class="btns"><button data-a="mtmeter">${meterStop?"Stoppa":"Starta ljudmätare"}</button></div>
    <div class="meter"><i id="mtbar"></i></div><div class="kv" id="mtmeterinfo"></div></div>
  <div class="mt"><h3>2. Förstår taligenkänningen?</h3>
    <div class="btns">${["fr-FR","es-ES","sv-SE"].map(l=>`<button data-a="mtlang" data-v="${l}" aria-pressed="${l===L}">${l}</button>`).join("")}</div>
    <div class="btns">${[["single","Läge A: enkel"],["cont","Läge B: kontinuerlig"]].map(([k,t])=>`<button data-a="mtmode" data-v="${k}" aria-pressed="${store.get("micmode","single")===k}">${t}</button>`).join("")}</div>
    <div class="btns"><button data-a="mtrec">Lyssna (säg något)</button><button data-a="mtcopy">Kopiera logg</button></div>
    <div class="kv" id="mtheard"></div>
    <pre class="log" id="mlog">${esc(MICLOG.join("\n"))||"Loggen visas här."}</pre></div>
  <div class="mt"><h3>Miljö</h3><div class="kv">${info.map(([k,v])=>`${k}: <b>${v}</b>`).join("<br>")}</div></div>
  <p class="note">Händer inget i steg 2 men stapeln rör sig i steg 1: kontrollera Inställningar → Siri → "Lyssna efter"/Siri på, Inställningar → Allmänt → Tangentbord → Diktering på, och Inställningar → Skärmtid → Innehålls- och integritetsbegränsningar → Tillåtna appar → Siri och diktering.</p>`;
}
async function toggleMeter(btn){
  if(meterStop){meterStop(); meterStop=null; btn.textContent="Starta ljudmätare"; return}
  const info=$("#mtmeterinfo");
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const ac=new (window.AudioContext||window.webkitAudioContext)(); await ac.resume();
    const an=ac.createAnalyser(); an.fftSize=512; ac.createMediaStreamSource(st).connect(an);
    const buf=new Uint8Array(an.fftSize); let raf, peak=0;
    const tick=()=>{an.getByteTimeDomainData(buf); let m=0; for(const v of buf) m=Math.max(m,Math.abs(v-128)); peak=Math.max(peak,m);
      const bar=$("#mtbar"); if(bar) bar.style.width=Math.min(100,m/64*100)+"%";
      if(info) info.textContent="Mikrofon: "+(st.getAudioTracks()[0]?.label||"okänd")+" · toppnivå "+peak+"/128"; raf=requestAnimationFrame(tick)};
    tick(); btn.textContent="Stoppa";
    meterStop=()=>{cancelAnimationFrame(raf); st.getTracks().forEach(t=>t.stop()); ac.close()};
  }catch(e){if(info) info.innerHTML="<b>Fel:</b> "+esc(e.name+" – "+e.message)}
}
function mtRec(btn){
  if(!REC){$("#mtheard").innerHTML="<b>Den här webbläsaren saknar taligenkänning.</b>"; return}
  if(meterStop){meterStop(); meterStop=null; const m=$("[data-a=mtmeter]"); if(m) m.textContent="Starta ljudmätare"}
  btn.textContent="Lyssnar…"; $("#mtheard").textContent="";
  startRec(S.mtLang||LANG[S.lang]?.tts||"fr-FR", alts=>{const h=$("#mtheard"); if(h) h.innerHTML="Hör: <b>"+esc(alts[0])+"</b>"; return false},
    why=>{btn.textContent="Lyssna (säg något)"; const h=$("#mtheard"); if(h&&!h.textContent) h.innerHTML="Inget hördes · "+esc(why)});
}
function advance(){
  const n=cat().items.length;
  S.idx++;
  if(S.idx<n){render(true); sayAfter()}
  else{render(); cheer(LANG[S.lang].praise[1]); if(P().kid) speak(LANG[S.lang].praise[1]); confetti()}
}

/* ---------- händelser ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a, v=b.dataset.v, L=LANG[S.lang];
  if(!["repeat","slow","pause","row","qsay","qslow","mic","mtlang","mtrec","mtmeter","mtcopy","mtmode"].includes(a)) stopAuto();
  if(meterStop && !a.startsWith("mt")){meterStop(); meterStop=null}
  if(a==="who"){S.p=null; S.view="who"; render()}
  else if(a==="person"){setPerson(v); render(); if(P().kid){speak(LANG[S.lang].hello+" "+P().name); cheer()}}
  else if(a==="lang"){S.lang=v; store.set("lang_"+S.p,v); S.bubble=null; render(); speak(LANG[v].hello); cheer()}
  else if(a==="home"){S.view="home"; S.bubble=null; render()}
  else if(a==="cat"){S.cat=v; S.view="cat"; S.bubble=cat().fx[S.lang]; render(); if(cat().kind!=="grammar") speak(cat().fx[S.lang])}
  else if(a==="row"){speak(cat().items[+v][S.lang])}
  else if(a==="learn"){S.view="learn"; S.idx=0; S.paused=false; S.bubble="Lyssna och säg efter!"; render(true); sayAfter()}
  else if(a==="next"){S.idx++; render(true); if(!S.paused) sayAfter()}
  else if(a==="prev"){S.idx=Math.max(0,S.idx-1); render(true); if(!S.paused) sayAfter()}
  else if(a==="repeat"){if(S.idx<cat().items.length){sayAfter(); const p=$(".cbtn[data-a=pause]"); if(p)p.innerHTML="⏸️<small>Paus</small>"}}
  else if(a==="slow"){sayAfter(true); const p=$(".cbtn[data-a=pause]"); if(p)p.innerHTML="⏸️<small>Paus</small>"}
  else if(a==="pause"){
    if(S.paused){sayAfter(); b.innerHTML="⏸️<small>Paus</small>"}
    else{stopAuto(); S.paused=true; setTurn("Pausad"); b.innerHTML="▶️<small>Fortsätt</small>"}
  }
  else if(a==="mic"){listen(b)}
  else if(a==="reload"){updateApp(b)}
  else if(a==="reset"){resetAll()}
  else if(a==="mictest"){S.back=S.view; S.view="mictest"; render()}
  else if(a==="mtlang"){S.mtLang=v; document.querySelectorAll("[data-a=mtlang]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===v))}
  else if(a==="mtrec"){mtRec(b)}
  else if(a==="mtmode"){store.set("micmode",v); document.querySelectorAll("[data-a=mtmode]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===v))}
  else if(a==="mtmeter"){toggleMeter(b)}
  else if(a==="mtcopy"){const t=MICLOG.join("\n")+"\n\n"+navigator.userAgent; (navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>{b.textContent="Kopierad!"},()=>{b.textContent="Gick inte att kopiera"})}
  else if(a==="good"){if(P().kid) S.bubble=L.praise[Math.random()*L.praise.length|0]; advance(); cheer()}
  else if(a==="quiz"){S.quiz=makeQuiz(); S.view="quiz"; S.bubble=L.luck; render(); autoQ()}
  else if(a==="qsay"){speak(S.quiz.qs[S.quiz.i].it[S.lang])}
  else if(a==="qslow"){speak(S.quiz.qs[S.quiz.i].it[S.lang],true)}
  else if(a==="ans"){answer(+v)}
  else if(a==="qnext"){
    const Q=S.quiz;
    if(Q.i<Q.qs.length-1){Q.i++; Q.answered=null; render(); autoQ()}
    else{
      const st=stars(Q.score,Q.qs.length), k=key(S.cat);
      if(st>(best[k]||0)){best[k]=st; store.set("best2",best)}
      S.view="done"; S.bubble=st>=2?L.praise[1]:(S.lang==="es"?"¡Otra vez!":"Encore !");
      render(); cheer(); if(P().kid) speak(S.bubble); if(st>=2) confetti();
    }
  }
});
function autoQ(){const q=S.quiz.qs[S.quiz.i]; if(q.type==="listen") setTimeout(()=>speak(q.it[S.lang]),250)}
function answer(i){
  const Q=S.quiz, q=Q.qs[Q.i]; if(Q.answered!=null) return;
  Q.answered=i; const L=LANG[S.lang];
  const right = q.type==="gap" ? q.opts[i]===q.a : q.opts[i]===q.it;
  const say = q.type==="gap" ? fullSentence(q) : q.it[S.lang];
  if(right){Q.score++; S.bubble=L.praise[Math.random()*L.praise.length|0]} else S.bubble=L.oops;
  render(); cheer();
  speak(right && P().kid ? S.bubble+" "+say : say);
}

/* ---------- konfetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=$("#fx"), ctx=cv.getContext("2d"), W=cv.width=innerWidth, H=cv.height=innerHeight;
  const cs=getComputedStyle(document.body), cols=[cs.getPropertyValue("--accent"),cs.getPropertyValue("--accent2"),"#23A955","#FF8DC7","#FFD21F"];
  const ps=Array.from({length:140},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,s:(Math.random()-.5)*.3}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});if(++t<150)requestAnimationFrame(f);else ctx.clearRect(0,0,W,H)})();
}

render();
setTimeout(()=>{if(S.view==="home")render()},800);
</script>
